<!DOCTYPE html>
<html>

<head>
    <title>WHITE_CMD</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            background: url(bg.jpg);
            background-size: cover;
            background-position: center;
            color: #00ff88;
            font-family: monospace;
            display: flex;
            flex-direction: column;
        }

        /* TERMINAL */
        #terminal {
            flex: 1;
            backdrop-filter: blur(20px);
            border: 2px solid #00ff88;
            padding: 15px;
            overflow-y: auto;

            /* PC default */
            font-size: 16px;
        }

        /* INPUT */
        input {
            width: 100%;
            height: 100px;
            font-size: 18px;
            background: black;
            color: #00ff88;
            border: none;
            border-top: 2px solid #00ff88;
            padding: 10px;

            position: sticky;
            bottom: 0;
        }

        .nametag{
                position:fixed;
                top:80%;
                left:50%;
                transform: translateX(-50%);
                color:rgb(79, 129, 3);
                opacity:0.2;
            }

        /* ================= MOBILE ================= */
        @media (max-width: 1024px) {

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                height: 93vh;
                background: url(bg.jpg);
                background-size: cover;
                background-position: center;
                color: #00ff88;
                font-family: monospace;
                display: flex;
                overflow: y;
                flex-direction: column;
            }

            #terminal {
                font-size: 38px;
                /* mas malaki sa phone */
                padding: 10px;
            }

            input {
                background: rgba(0, 0, 0, 0.178);
                position: fixed;
                bottom: 20px;
                height: 100px;
                font-size: 30px;
                padding: 12px;
            }

            input:focus {
                color: rgb(9, 255, 0);
                background: rgba(21, 255, 0, 0);
            }
            .nametag{
                position:fixed;
                top:60%;
                left:50%;
                transform: translateX(-50%);
                color:rgb(79, 129, 3);
                opacity:0.2;
            }
        }

        /* ================= SMALL PHONE ================= */
        @media (max-width: 480px) {

            #terminal {
                font-size: 20px;
                /* readable talaga */
            }

            input {
                font-size: 22px;
                height: 70px;
            }
        }
    </style>
</head>

<body>

    <div id="terminal"><div class="nametag">Made by Wenxyz</div></div>

    <input id="commandInput" placeholder="Type command...">

    <script>
        const t = document.getElementById("terminal");
        const i = document.getElementById("commandInput");

        let history = [];
        let music = null;
        let volume = 1;

        // ===== TYPING SETTINGS =====
        let typingSpeed = 0; // mas mababa = mas mabilis
        let typingQueue = Promise.resolve();
        let typingSound = false;

        // AUTO FOCUS
        setInterval(() => i.focus(), 1000);

        // ================= TYPING FUNCTION =================
        function typePrint(text) {
            typingQueue = typingQueue.then(() => {
                return new Promise(resolve => {
                    let d = document.createElement("div");
                    t.appendChild(d);

                    let index = 0;

                    function type() {
                        if (index < text.length) {
                            d.textContent += text[index];

                            if (typingSound) {
                                let beep = new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");
                                beep.volume = 0.1;
                                beep.play();
                            }

                            index++;
                            setTimeout(type, typingSpeed);
                        } else {
                            t.scrollTop = t.scrollHeight;
                            resolve();
                        }
                    }

                    type();
                });
            });
        }

        // ================= PRINT =================
        function print(txt) {
            typePrint(txt);
        }

        // ================= COMMAND =================
        i.addEventListener("keypress", async (e) => {
            if (e.key === "Enter") {

                let cmd = i.value.trim();
                let lower = cmd.toLowerCase();

                history.push(cmd);
                print(">> " + cmd);

                try {

                    // HELP
                    if (lower === "help") {
                        print("Commands: help, clear, history, calc, echo");
                        print("storage, save, get, delete");
                        print("theme green/red/blue/dark");
                        print("music on/off, volume set");
                        print("typing speed, typing sound on/off");
                        print("undo, random, date");
                        print("device full, ram, cpu, screen, network, battery");
                        print("subnet, profile, clear storage");
                        print("system scan, opensite, search");
                        print("secretsites, timezone");
                        print("about, system scan, profile");
                    }

                    // CLEAR
                    else if (lower === "clear") {
                        t.innerHTML = "";
                    }

                    // HISTORY
                    else if (lower === "history") {
                        history.forEach(h => print(h));
                    }

                    // CALC SAFE
                    else if (lower.startsWith("calc")) {
                        let exp = cmd.replace("calc ", "");
                        if (/^[0-9+\-*/(). ]+$/.test(exp)) {
                            print(eval(exp));
                        } else {
                            print("Invalid expression");
                        }
                    }

                    // ECHO
                    else if (lower.startsWith("echo")) {
                        print(cmd.replace("echo ", ""));
                    }

                    // STORAGE
                    else if (lower.startsWith("save")) {
                        let parts = cmd.split(" ");
                        localStorage.setItem(parts[1], parts.slice(2).join(" "));
                        print("Saved!");
                    }

                    else if (lower.startsWith("get")) {
                        let key = cmd.split(" ")[1];
                        print(localStorage.getItem(key) || "Not found");
                    }

                    else if (lower.startsWith("delete")) {
                        let key = cmd.split(" ")[1];
                        localStorage.removeItem(key);
                        print("Deleted!");
                    }

                    else if (lower === "storage") {
                        Object.keys(localStorage).forEach(k => {
                            print(k + " = " + localStorage.getItem(k));
                        });
                    }

                    // THEME
                    else if (lower.startsWith("theme")) {
                        let color = lower.split(" ")[1];

                        if (color === "green") document.body.style.color = "#00ff88";
                        if (color === "red") document.body.style.color = "red";
                        if (color === "blue") document.body.style.color = "cyan";
                        if (color === "dark") document.body.style.color = "white";

                        print("Theme changed");
                    }

                    // MUSIC
                    else if (lower === "music on") {
                        if (!music) {
                            music = new Audio("https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3");
                            music.loop = true;
                            music.volume = volume;
                            music.play();
                            print("Music ON");
                        }
                    }

                    else if (lower === "music off") {
                        if (music) {
                            music.pause();
                            music = null;
                            print("Music OFF");
                        }
                    }

                    else if (lower.startsWith("volume")) {
                        let v = parseFloat(lower.split(" ")[2]);
                        if (!isNaN(v)) {
                            volume = v;
                            if (music) music.volume = v;
                            print("Volume set to " + v);
                        }
                    }

                    // ===== TYPING CONTROL =====
                    else if (lower.startsWith("typing speed")) {
                        let sp = parseInt(lower.split(" ")[2]);
                        if (!isNaN(sp)) {
                            typingSpeed = sp;
                            print("Typing speed set to " + sp);
                        }
                    }

                    else if (lower === "typing sound on") {
                        typingSound = true;
                        print("Typing sound ON");
                    }

                    else if (lower === "typing sound off") {
                        typingSound = false;
                        print("Typing sound OFF");
                    }

                    // UNDO
                    else if (lower === "undo") {
                        if (t.lastChild) t.removeChild(t.lastChild);
                    }

                    // RANDOM
                    else if (lower === "random") {
                        print(Math.random());
                    }

                    // DATE
                    else if (lower === "date") {
                        print(new Date().toString());
                    }

                    // ================= DEVICE FULL INFO =================
                    else if (lower === "device full") {
                        print("=== DEVICE INFO ===");
                        print("Platform: " + navigator.platform);
                        print("UserAgent: " + navigator.userAgent);
                        print("Language: " + navigator.language);
                        print("Online: " + navigator.onLine);
                        print("Cores: " + navigator.hardwareConcurrency);

                        if (navigator.deviceMemory) {
                            print("RAM (approx): " + navigator.deviceMemory + " GB");
                        } else {
                            print("RAM: Not supported");
                        }
                    }

                    // ================= RAM =================
                    else if (lower === "ram") {
                        if (navigator.deviceMemory) {
                            print("RAM: " + navigator.deviceMemory + " GB");
                        } else {
                            print("RAM info not available");
                        }
                    }

                    // ================= CPU =================
                    else if (lower === "cpu") {
                        print("CPU Cores: " + navigator.hardwareConcurrency);
                    }

                    // ================= SCREEN =================
                    else if (lower === "screen") {
                        print("Width: " + screen.width);
                        print("Height: " + screen.height);
                    }

                    // ================= NETWORK =================
                    else if (lower === "network") {
                        print("Online: " + navigator.onLine);
                        if (navigator.connection) {
                            print("Type: " + navigator.connection.effectiveType);
                        }
                    }

                    else if (lower === "scan network") {
                        print("Scanning local network...");

                        let devices = [
                            "192.168.1.1 Router",
                            "192.168.1.2 Phone",
                            "192.168.1.3 Laptop",
                            "192.168.1.4 Unknown Device"
                        ];

                        let i = 0;
                        let interval = setInterval(() => {
                            print("FOUND → " + devices[i]);
                            i++;

                            if (i >= devices.length) {
                                clearInterval(interval);
                                print("SCAN COMPLETE");
                            }
                        }, 600);
                    }

                    else if (lower === "subnet") {
                        print("please type \"subnet <your IP>/<your CIDR>\"");
                        print("=================================================")
                        print("example: subnet 192.168.1.1/24");
                        print("=================================================")
                    }

                    else if (lower.startsWith("subnet ")) {
                        let input = cmd.replace("subnet ", "").trim();

                        try {
                            let [ip, cidr] = input.split("/");

                            if (!ip || !cidr) {
                                print("Format: subnet 192.168.1.10/24");
                                return;
                            }

                            cidr = parseInt(cidr);

                            if (cidr < 0 || cidr > 32) {
                                print("Invalid CIDR ❌");
                                return;
                            }

                            let ipParts = ip.split(".").map(Number);

                            if (ipParts.length !== 4 || ipParts.some(n => isNaN(n) || n < 0 || n > 255)) {
                                print("Invalid IP address ❌");
                                return;
                            }

                            let ipNum =
                                (ipParts[0] << 24) |
                                (ipParts[1] << 16) |
                                (ipParts[2] << 8) |
                                ipParts[3];

                            let mask = cidr === 0 ? 0 : (0xFFFFFFFF << (32 - cidr)) >>> 0;

                            let network = ipNum & mask;
                            let broadcast = network | (~mask >>> 0);

                            function toIP(num) {
                                return [
                                    (num >>> 24) & 255,
                                    (num >>> 16) & 255,
                                    (num >>> 8) & 255,
                                    num & 255
                                ].join(".");
                            }

                            let totalHosts = Math.pow(2, (32 - cidr));
                            let usableHosts = totalHosts - 2;

                            print("=== SUBNET CALCULATION ===");
                            print("IP Address: " + ip);
                            print("CIDR: /" + cidr);
                            print("Subnet Mask: " + toIP(mask));
                            print("Network Address: " + toIP(network));
                            print("Broadcast Address: " + toIP(broadcast));
                            print("Total Hosts: " + totalHosts);
                            print("Usable Hosts: " + (usableHosts > 0 ? usableHosts : 0));

                        } catch (e) {
                            print("Error in subnet calculation ❌");
                        }
                    }

                    // ================= BATTERY =================
                    else if (lower === "battery") {
                        if (navigator.getBattery) {
                            let b = await navigator.getBattery();
                            print("Battery: " + (b.level * 100) + "%");
                            print("Charging: " + b.charging);
                        } else {
                            print("Battery API not supported");
                        }
                    }



                    else if (lower === "search") {
                        print("Search: ");
                    }

                    else if (lower === "secretsites") {

                        let pass = prompt("Enter system password: ");

                        if (pass === "WHITE12") {

                            print("🔓 ACCESS GRANTED");
                            print("Please choose a site to open:");
                            print("ph");
                            print("xv");
                            print("bg");
                            print("kf");
                            print("pf");
                            print("Lp");

                        } else {

                            print("❌ ACCESS DENIED");
                            print("Wrong password");

                    }

                    else if (lower === "ph") {
                        print("Opening...");

                        setTimeout(() => {
                            window.open("https://www.pornhub.com", "_blank");
                        }, 800);
                    }

                    else if (lower === "xv") {
                        print("Opening...");

                        setTimeout(() => {
                            window.open("https://www.xvideos.com", "_blank");
                        }, 800);
                    }

                    else if (lower === "bg") {

                        }, 800);
                    }

                    else if (lower === "kf") {
                        print("Opening...");

                        setTimeout(() => {
                            window.open("https://kantotflix.com", "_blank");

                    }

                    else if (lower === "pf") {

                    }

                    else if (lower === "Lp") {
                        print("Opening...");

                        setTimeout(() => {
                            window.open("https://lootedpinay.com", "_blank");
                        }, 800);
                    }

                    // ================= Open =================

                    else if (lower === "opensite") {
                        print("Please choose a site to open");
                        print("open yt, open fb, open yt");
                    }

                    else if (lower === "open yt") {
                        print("Opening YouTube...");

                        setTimeout(() => {
                            window.open("https://www.youtube.com", "_blank");
                        }, 800);
                    }

                    else if (lower === "open fb") {
                        print("Opening Facebook...");

                        setTimeout(() => {
                            window.open("https://www.facebook.com", "_blank");
                        }, 800);
                    }

                    else if (lower === "open ig") {
                        print("Opening Instagram...");

                        setTimeout(() => {
                            window.open("https://www.instagram.com", "_blank");
                        }, 800);
                    }

                    // ================= HISTORY CLEAR =================
                    else if (lower === "history clear") {
                        history = [];
                        print("History cleared");
                    }

                    // ================= HISTORY EXPORT =================
                    else if (lower === "history export") {
                        let data = history.join("\n");
                        navigator.clipboard.writeText(data);
                        print("History copied to clipboard");
                    }

                    else if (lower === "about") {

                        print("=================================================================");
                        print("🧠 SYSTEM PROFILE: WHITE_CMD");
                        print("=================================================================");

                        print("👤 Name: Wendell Tyrone A. Jimenez");
                        print("🎓 Age: 20 years old");
                        print("📍 Location: Philippines");
                        print("🏫 Role: IT Student / Developer");

                        print("=================================================================");

                        print("💻 SKILLS & EXPERTISE:");
                        print("- Full Stack Web Development");
                        print("- Backend Development (C#, JavaScript, Firebase)");
                        print("- Networking & System Concepts");
                        print("- Ethical Hacking Fundamentals");
                        print("- UI/UX & Frontend Design");
                        print("- Problem Solving & Debugging");

                        print("=================================================================");

                        print("🚀 CURRENT PROJECT:");
                        print("WHITE_CMD - Cyber Terminal System");
                        print("A browser-based command-line system with");
                        print("network tools, calculators, converters, and utilities.");

                        print("=================================================================");

                        print("🎯 GOAL:");
                        print("To become a professional Full Stack Developer");
                        print("and build impactful systems that help people.");

                        print("=================================================================");
                        print("Come and visit my Github Portfolio => 🔴https://wentyrone12.github.io/MyPortfolio🔴 <=")
                        print("=================================================================");
                        print("")
                        print("")
                        print("")
                        print("")
                        print("")
                        print("=================================================================");
                        print("Come and visit my Services => 🔴https://wentyrone12.github.io🔴 <=")
                        print("=================================================================");

                    }

                    else if (lower.startsWith("profile")) {
                        let parts = cmd.replace("profile ", "").split(",");

                        if (parts.length < 2) {
                            print("Usage: profile Full Name, YYYY-MM-DD");
                        } else {
                            let name = parts[0].trim();
                            let birth = parts[1].trim();

                            print("=== USER PROFILE ===");
                            print("Name: " + name);
                            print("Birthday: " + birth);

                            generatePasswords(name, birth);
                        }
                    }

                    else if (lower === "clear storage") {
                        localStorage.clear();
                        print("🧹 LocalStorage cleared successfully");
                    }

                    else if (lower === "system scan") {
                        print("Scanning device.....");
                        setTimeout(() => {
                            print("✔ CPU OK");
                            print("✔ RAM OK");
                            print("✔ Network OK");
                            print("✔ Security: ACTIVE");
                        }, 4500);
                    }

                    else if (lower === "live clock") {

                        print("🕒 LIVE CLOCK STARTED");

                        setInterval(() => {

                            let now = new Date();

                            print(now.toLocaleTimeString());

                        }, 1000);
                    }

                    else if (lower.startsWith("search ")) {
                        let query = cmd.replace("search ", "");
                        let url = "https://www.google.com/search?q=" + encodeURIComponent(query);

                        print("Searching: " + query);

                        setTimeout(() => {
                            window.open(url, "_blank");
                        }, 800);
                    }

                    else if (lower === "timezone") {

                        print("🌍 AVAILABLE TIMEZONES:");
                        print("time philippines");
                        print("time japan");
                        print("time korea");
                        print("time usa");
                        print("time london");
                        print("time dubai");
                        print("time canada");
                        print("time australia");
                        print("time singapore");
                        print("time india");
                        print("time china");
                        print("time france");
                        print("time germany");
                        print("time brazil");
                        print("time south africa");

                    }

                    else if (lower.startsWith("time ")) {

                        let place = lower.replace("time ", "").trim();

                        const zones = {

                            philippines: {
                                zone: "Asia/Manila",
                                label: "🇵🇭 Philippines"
                            },

                            japan: {
                                zone: "Asia/Tokyo",
                                label: "🇯🇵 Japan"
                            },

                            korea: {
                                zone: "Asia/Seoul",
                                label: "🇰🇷 South Korea"
                            },

                            usa: {

                                label: "🇺🇸 USA"
                            },

                            london: {
                                zone: "Europe/London",
                                label: "🇬🇧 London"
                            },

                            dubai: {
                                zone: "Asia/Dubai",
                                label: "🇦🇪 Dubai"
                            },

                            canada: {
                                zone: "America/Toronto",
                                label: "🇨🇦 Canada"
                            },

                            australia: {
                                zone: "Australia/Sydney",
                                label: "🇦🇺 Australia"
                            },

                            singapore: {
                                zone: "Asia/Singapore",
                                label: "🇸🇬 Singapore"
                            },

                            india: {
                                zone: "Asia/Kolkata",
                                label: "🇮🇳 India"
                            },

                            china: {
                                zone: "Asia/Shanghai",
                                label: "🇨🇳 China"
                            },

                            france: {
                                zone: "Europe/Paris",
                                label: "🇫🇷 France"
                            },

                            germany: {
                                zone: "Europe/Berlin",
                                label: "🇩🇪 Germany"
                            },

                            brazil: {
                                zone: "America/Sao_Paulo",
                                label: "🇧🇷 Brazil"
                            },

                            "south africa": {
                                zone: "Africa/Johannesburg",
                                label: "🇿🇦 South Africa"
                            }

                        };

                        if (zones[place]) {

                            let now = new Date();

                            let time = now.toLocaleString("en-US", {
                                timeZone: zones[place].zone,
                                weekday: "long",
                                year: "numeric",
                                month: "long",
                                day: "numeric",
                                hour: "numeric",
                                minute: "numeric",
                                second: "numeric",
                                hour12: true
                            });

                            print("🌍 " + zones[place].label);
                            print("🕒 " + time);

                        } else {

                            print("❌ Timezone not found");
                            print("Type: timezone");

                        }
                    }

                    // UNKNOWN
                    else {
                        suggest(lower);
                    }

                } catch {
                    print("Error executing command");
                }

                i.value = "";
            }
        });

        // SUGGEST
        function suggest(cmd) {
            let commands = ["help", "storage", "history", "calc", "echo", "save", "get", "delete", "music on"];
            let found = commands.find(c => c.includes(cmd));
            if (found) print("Error. Did you mean: " + found + " ?");
            else print("Error command");
        }

        window.onload = () => {
            bootSequence();
        };

        function bootSequence() {
            print("Initializing WHITE_KALI_LINUX........");
            print("Loading system modules...");

        function generatePasswords(name, birth) {
            print("Generating smart password ideas...");

            let n = name.replace(/\s/g, "").toLowerCase();
            let b = birth.replace(/-/g, "");

            let year = birth.split("-")[0];
            let day = birth.split("-")[2] || "00";

            let passwords = [
                n + year + "!",
                n + day + "@",
                n + "@" + year,
                n + b.slice(-4),
                n.charAt(0).toUpperCase() + n.slice(1) + year,
                year + n + "2026",
                n + "X" + Math.floor(Math.random() * 999),
                "WBANK" + n.slice(0, 3) + year
            ];

            print("=== PASSWORD IDEAS ===");

            let i = 0;
            let interval = setInterval(() => {
                print("🔐 " + passwords[i]);
                i++;

                if (i >= passwords.length) {
                    clearInterval(interval);
                    print("✔ Done generating passwords");
                }
            }, 400);
        }

        document.addEventListener("contextmenu", function (e) {
