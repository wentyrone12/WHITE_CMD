<!DOCTYPE html>
<html>

<head>
    <title>WHITE_CMD</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 85vh;
            background: url(bg.jpg);
            background-size: cover;
            background-position: center;
            color: #00ff88;
            font-family: monospace;
            display: flex;
            flex-direction: column;
        }

        /* TERMINAL */
        #terminal {
            flex: 1;
            backdrop-filter: blur(20px);
            border: 2px solid #00ff88;
            padding: 15px;
            overflow-y: auto;
            height: 90%;
            font-size: 16px;
        }

        /* INPUT */
        input {
            width: 100%;
            height: 100px;
            font-size: 18px;
            background-color: black;
            color: #00ff88;
            padding: 10px;
            position: fixed;
            bottom: 2px;
        }

        .nametag {
            position: fixed;
            top: 80%;
            left: 50%;
            transform: translateX(-50%);
            color: rgb(79, 129, 3);
            opacity: 0.6;
        }

        input:focus {
            background-color: rgb(0, 0, 0);
            color: rgb(6, 209, 6);
        }

        /* ================= MOBILE ================= */
        @media (max-width: 1024px) {

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                height: 85vh;
                background: url(bg.jpg);
                background-size: cover;
                background-position: center;
                color: #00ff88;
                font-family: monospace;
                display: flex;
                overflow-y: auto;
                flex-direction: column;
            }

            #terminal {
                font-size: 30px;
                overflow-y: auto;
                padding: 10px;
            }

            input {
                background-color: rgba(0, 0, 0, 0.178);
                position: fixed;
                bottom: 2px;
                height: 100px;
                font-size: 30px;
                padding: 12px;
            }

            input:focus {
                background-color: rgb(0, 0, 0);
                color: rgb(6, 209, 6);
            }

            .nametag {
                position: fixed;
                top: 60%;
                left: 50%;
                transform: translateX(-50%);
                color: rgb(79, 129, 3);
                opacity: 0.6;
            }
        }

        /* ================= SMALL PHONE ================= */
        @media (max-width: 480px) {

            body {
                margin: 0;
                height: 85vh;
                background: url(bg.jpg);
                background-size: cover;
                background-position: center;
                color: #00ff88;
                font-family: monospace;
                display: flex;
                overflow-y: auto;
                flex-direction: column;
            }

            #terminal {
                font-size: 38px;
                overflow: auto;
                padding: 10px;
            }

            input {
                background-color: rgba(0, 0, 0, 0.178);
                position: fixed;
                bottom: 20px;
                height: 100px;
                font-size: 30px;
                padding: 12px;
            }
        }
    </style>
</head>

<body>

    <div id="terminal">
        <div class="nametag">Made by Wenxyz</div>
    </div>

    <input id="commandInput" placeholder="Type command...">

    <script>
        const t = document.getElementById("terminal");
        const i = document.getElementById("commandInput");

        let history = [];
        let music = null;
        let volume = 1;

        // ===== TYPING SETTINGS =====
        let typingSpeed = 0; // mas mababa = mas mabilis
        let typingQueue = Promise.resolve();
        let typingSound = false;

        // AUTO FOCUS
        setInterval(() => i.focus(), 1000);

        // ================= TYPING FUNCTION =================
        function typePrint(text) {
            typingQueue = typingQueue.then(() => {
                return new Promise(resolve => {
                    let d = document.createElement("div");
                    t.appendChild(d);

                    let index = 0;

                    function type() {
                        if (index < text.length) {
                            d.textContent += text[index];

                            if (typingSound) {
                                let beep = new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");
                                beep.volume = 0.1;
                                beep.play();
                            }

                            index++;
                            setTimeout(type, typingSpeed);
                        } else {
                            t.scrollTop = t.scrollHeight;
                            resolve();
                        }
                    }

                    type();
                });
            });
        }

        // ================= PRINT =================
        function print(txt) {
            typePrint(txt);
        }

        // ================= COMMAND =================
        i.addEventListener("keypress", async (e) => {
            if (e.key === "Enter") {

                let cmd = i.value.trim();
                let lower = cmd.toLowerCase();

                history.push(cmd);
                print(">> " + cmd);

                try {

                    // HELP
                    if (lower === "help") {
                        print("Commands: help, clear, history, calc, echo");
                        print("storage, save, get, delete");
                        print("theme green/red/blue/dark");
                        print("music on/off, volume set");
                        print("typing speed, typing sound on/off");
                        print("undo, random, date, clock, weather");
                        print("device full, ram, cpu, screen, network, battery");
                        print("subnet, profile, clear storage");
                        print("system scan,files, opensite, search");
                        print("copy, gen password, open camera, vibrate, speak, joke");
                        print("flip coin, roll dice, qr, battery live, screenshot, countdown, stopwatch ");
                        print("random color, map, uptime, virus scan, internet speed, ");
                        print("note, shownote, banner, java, touch points, color depth");
                        print("browser, platform, pixed depth, window position, outer siez, path, ");
                        print("port, hash, secure, modified, charset, show cookies, domain, visibility, is fullscreen,hex");
                        print("password, downlink, ping, save data, mic check, camera check, notification, enable notification, test notification,");
                        print("storage support, session support, url info, memory test, device type, os, refresh");
                        print("refresh, back, forward, print page, page size, diagnostic, generate uuid");
                        print("encode, decode, cmd hash, ascii clock, temperature");
                        print("gpu, battery health, clean cache, check date, hex color, preview color, dump color, ");
                        print("alert, speak fast, speak slow,otp,dpi, iso date, ");
                        print("mobile check, matrix, quote, open ai, milliseconds,  ");
                        print("internet check,favicon,rand,beep,random image,params,memory usage ,secretsites, timezone");
                        print("about,cyber mode, system scan, profile");
                    }

                    // CLEAR
                    else if (lower === "clear") {
                        t.innerHTML = "";
                    }

                    // HISTORY
                    else if (lower === "history") {
                        history.forEach(h => print(h));
                    }

                    // CALC SAFE
                    else if (lower.startsWith("calc")) {
                        let exp = cmd.replace("calc ", "");
                        if (/^[0-9+\-*/(). ]+$/.test(exp)) {
                            print(eval(exp));
                        } else {
                            print("Invalid expression");
                        }
                    }

                    // ECHO
                    else if (lower.startsWith("echo")) {
                        print(cmd.replace("echo ", ""));
                    }

                    // STORAGE
                    else if (lower.startsWith("save")) {
                        let parts = cmd.split(" ");
                        localStorage.setItem(parts[1], parts.slice(2).join(" "));
                        print("Saved!");
                    }

                    else if (lower.startsWith("get")) {
                        let key = cmd.split(" ")[1];
                        print(localStorage.getItem(key) || "Not found");
                    }

                    else if (lower.startsWith("delete")) {
                        let key = cmd.split(" ")[1];
                        localStorage.removeItem(key);
                        print("Deleted!");
                    }

                    else if (lower === "storage") {
                        Object.keys(localStorage).forEach(k => {
                            print(k + " = " + localStorage.getItem(k));
                        });
                    }

                    // THEME
                    else if (lower.startsWith("theme")) {
                        let color = lower.split(" ")[1];

                        if (color === "green") document.body.style.color = "#00ff88";
                        if (color === "red") document.body.style.color = "red";
                        if (color === "blue") document.body.style.color = "cyan";
                        if (color === "dark") document.body.style.color = "white";

                        print("Theme changed");
                    }

                    // ================= 1. COPY TEXT =================
                    else if (lower.startsWith("copy ")) {

                        let text = cmd.replace("copy ", "");

                        navigator.clipboard.writeText(text);

                        print("📋 Copied to clipboard");

                    }

                    // ================= 2. GENERATE PASSWORD =================
                    else if (lower === "gen password") {

                        let chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789@#$";
                        let pass = "";

                        for (let i = 0; i < 14; i++) {
                            pass += chars[Math.floor(Math.random() * chars.length)];
                        }

                        print("🔐 Generated Password:");
                        print(pass);

                    }

                    // ================= 3. OPEN CAMERA =================
                    else if (lower === "open camera") {

                        navigator.mediaDevices.getUserMedia({ video: true })
                            .then(stream => {

                                let video = document.createElement("video");

                                video.srcObject = stream;
                                video.autoplay = true;
                                video.style.width = "300px";

                                t.appendChild(video);

                                print("📷 Camera opened");

                            })
                            .catch(() => {
                                print("❌ Camera access denied");
                            });

                    }

                    // ================= 4. VIBRATION =================
                    else if (lower === "vibrate") {

                        navigator.vibrate(1000);

                        print("📳 Device vibrating");

                    }

                    // ================= 5. SPEAK TEXT =================
                    else if (lower.startsWith("speak ")) {

                        let text = cmd.replace("speak ", "");

                        let speech = new SpeechSynthesisUtterance(text);

                        speechSynthesis.speak(speech);

                        print("🗣 Speaking...");

                    }

                    // ================= 6. RANDOM JOKE =================
                    else if (lower === "joke") {

                        let jokes = [
                            "Why do programmers hate nature? Too many bugs.",
                            "JavaScript is not broken. It's misunderstood.",
                            "Programmer: A machine that turns coffee into code."
                        ];

                        print(jokes[Math.floor(Math.random() * jokes.length)]);

                    }

                    // ================= 7. FLIP COIN =================
                    else if (lower === "flip coin") {

                        let result = Math.random() < 0.5 ? "HEADS" : "TAILS";

                        print("🪙 " + result);

                    }

                    // ================= 8. ROLL DICE =================
                    else if (lower === "roll dice") {

                        let dice = Math.floor(Math.random() * 6) + 1;

                        print("🎲 Dice: " + dice);

                    }

                    // ================= 9. GENERATE QR =================
                    else if (lower.startsWith("qr ")) {

                        let text = encodeURIComponent(cmd.replace("qr ", ""));

                        let img = document.createElement("img");

                        img.src = "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=" + text;

                        t.appendChild(img);

                        print("📱 QR Generated");

                    }

                    // ================= 10. BATTERY LIVE =================
                    else if (lower === "battery live") {

                        navigator.getBattery().then(b => {

                            print("🔋 Battery: " + (b.level * 100) + "%");

                            setInterval(() => {
                                print("Battery: " + (b.level * 100) + "%");
                            }, 10000);

                        });

                    }

                    // ================= 11. SCREENSHOT PAGE =================
                    else if (lower === "screenshot") {

                        html2canvas(document.body).then(canvas => {

                            let a = document.createElement("a");

                            a.download = "screenshot.png";
                            a.href = canvas.toDataURL();

                            a.click();

                            print("📸 Screenshot downloaded");

                        });

                    }

                    // ================= 12. COUNTDOWN =================
                    else if (lower.startsWith("countdown ")) {

                        let sec = parseInt(cmd.replace("countdown ", ""));

                        let interval = setInterval(() => {

                            print("⏳ " + sec);

                            sec--;

                            if (sec < 0) {
                                clearInterval(interval);
                                print("⏰ TIME UP");
                            }

                        }, 1000);

                    }

                    // ================= 13. STOPWATCH =================
                    else if (lower === "stopwatch") {

                        let sec = 0;

                        setInterval(() => {

                            sec++;

                            print("⏱ " + sec + " sec");

                        }, 1000);

                    }

                    // ================= 14. COLOR GENERATOR =================
                    else if (lower === "random color") {

                        let color = "#" + Math.floor(Math.random() * 16777215).toString(16);

                        document.body.style.color = color;

                        print("🎨 New Color: " + color);

                    }

                    // ================= 15. OPEN GOOGLE MAP =================
                    else if (lower.startsWith("map ")) {

                        let place = encodeURIComponent(cmd.replace("map ", ""));

                        window.open("https://www.google.com/maps/search/" + place);

                        print("🗺 Opening map...");

                    }

                    // ================= 16. DEVICE UPTIME =================
                    else if (lower === "uptime") {

                        print("⏳ Page active for:");
                        print(Math.floor(performance.now() / 1000) + " seconds");

                    }

                    // ================= 17. FAKE VIRUS SCAN =================
                    else if (lower === "virus scan") {

                        print("🛡 Scanning system...");

                        setTimeout(() => print("Checking files..."), 1000);
                        setTimeout(() => print("Checking memory..."), 2000);
                        setTimeout(() => print("✔ No threats detected"), 3500);

                    }

                    // ================= 18. INTERNET SPEED TEST =================
                    else if (lower === "internet speed") {

                        let start = performance.now();

                        fetch("https://jsonplaceholder.typicode.com/posts")
                            .then(() => {

                                let end = performance.now();

                                print("🌐 Approx Speed:");
                                print((end - start).toFixed(0) + " ms latency");

                            });

                    }

                    // ================= 19. NOTES APP =================
                    else if (lower.startsWith("note ")) {

                        let note = cmd.replace("note ", "");

                        localStorage.setItem("note", note);

                        print("📝 Note saved");

                    }

                    else if (lower === "show note") {

                        print(localStorage.getItem("note") || "No note saved");

                    }

                    // ================= 20. ASCII BANNER =================
                    else if (lower === "banner") {

                        print("██╗    ██╗██████╗  █████╗ ███╗   ██╗██╗  ██╗");
                        print("██║    ██║██╔══██╗██╔══██╗████╗  ██║██║ ██╔╝");
                        print("██║ █╗ ██║██████╔╝███████║██╔██╗ ██║█████╔╝ ");
                        print("██║███╗██║██╔══██╗██╔══██║██║╚██╗██║██╔═██╗ ");
                        print("╚███╔███╔╝██████╔╝██║  ██║██║ ╚████║██║  ██╗");
                        print(" ╚══╝╚══╝ ╚═════╝ ╚═╝  ╚═╝╚═╝  ╚═══╝╚═╝  ╚═╝");

                    }

                    // ================= 1. DEVICE NAME =================
                    else if (lower === "device name") {

                        print("🖥 Device Platform: " + navigator.platform);

                    }

                    // ================= 2. BROWSER NAME =================
                    else if (lower === "browser") {

                        print("🌐 Browser Info:");
                        print(navigator.userAgent);

                    }

                    // ================= 3. CHECK JAVA =================
                    else if (lower === "java") {

                        print("☕ Java Enabled: " + navigator.javaEnabled());

                    }

                    // ================= 4. MAX TOUCH POINTS =================
                    else if (lower === "touch points") {

                        print("👆 Max Touch Points: " + navigator.maxTouchPoints);

                    }

                    // ================= 5. COLOR DEPTH =================
                    else if (lower === "color depth") {

                        print("🎨 Color Depth: " + screen.colorDepth);

                    }

                    // ================= 6. PIXEL DEPTH =================
                    else if (lower === "pixel depth") {

                        print("🖼 Pixel Depth: " + screen.pixelDepth);

                    }

                    // ================= 7. WINDOW POSITION =================
                    else if (lower === "window position") {

                        print("X: " + window.screenX);
                        print("Y: " + window.screenY);

                    }

                    // ================= 8. WINDOW OUTER SIZE =================
                    else if (lower === "outer size") {

                        print("Width: " + window.outerWidth);
                        print("Height: " + window.outerHeight);

                    }

                    // ================= 9. CURRENT PATH =================
                    else if (lower === "path") {

                        print(window.location.pathname);

                    }

                    // ================= 10. PORT INFO =================
                    else if (lower === "port") {

                        print(window.location.port || "Default Port");

                    }

                    // ================= 11. HASH INFO =================
                    else if (lower === "hash") {

                        print(window.location.hash || "No hash");

                    }

                    // ================= 12. CHECK HTTPS =================
                    else if (lower === "secure") {

                        print(location.protocol === "https:" ? "🔒 Secure HTTPS" : "❌ Not Secure");

                    }

                    // ================= 13. LAST MODIFIED =================
                    else if (lower === "modified") {

                        print("📅 Last Modified:");
                        print(document.lastModified);

                    }

                    // ================= 14. CHARACTER SET =================
                    else if (lower === "charset") {

                        print("🔤 Charset: " + document.characterSet);

                    }

                    // ================= 15. PAGE COOKIES =================
                    else if (lower === "show cookies") {

                        print(document.cookie || "No cookies");

                    }

                    // ================= 16. DOMAIN =================
                    else if (lower === "domain") {

                        print(document.domain);

                    }

                    // ================= 17. PAGE VISIBILITY =================
                    else if (lower === "visibility") {

                        print(document.visibilityState);

                    }

                    // ================= 18. CHECK FULLSCREEN =================
                    else if (lower === "is fullscreen") {

                        print(document.fullscreenElement ? "YES" : "NO");

                    }

                    // ================= 19. RANDOM HEX =================
                    else if (lower === "hex") {

                        print("#" + Math.floor(Math.random() * 16777215).toString(16));

                    }

                    // ================= 20. RANDOM PASSWORD =================
                    else if (lower === "password") {

                        let chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

                        let pass = "";

                        for (let i = 0; i < 16; i++) {
                            pass += chars[Math.floor(Math.random() * chars.length)];
                        }

                        print("🔐 " + pass);

                    }

                    // ================= 21. NETWORK DOWNLINK =================
                    else if (lower === "downlink") {

                        if (navigator.connection) {
                            print("⬇ Speed: " + navigator.connection.downlink + " Mbps");
                        } else {
                            print("Not supported");
                        }

                    }

                    // ================= 22. NETWORK RTT =================
                    else if (lower === "ping") {

                        if (navigator.connection) {
                            print("📡 RTT: " + navigator.connection.rtt + " ms");
                        } else {
                            print("Not supported");
                        }

                    }

                    // ================= 23. SAVE DATA MODE =================
                    else if (lower === "save data") {

                        if (navigator.connection) {
                            print("💾 Save Data: " + navigator.connection.saveData);
                        }

                    }

                    // ================= 24. CHECK MICROPHONE =================
                    else if (lower === "mic check") {

                        navigator.mediaDevices.getUserMedia({ audio: true })
                            .then(() => print("🎤 Microphone Available"))
                            .catch(() => print("❌ Microphone Blocked"));

                    }

                    // ================= 25. CHECK CAMERA =================
                    else if (lower === "camera check") {

                        navigator.mediaDevices.getUserMedia({ video: true })
                            .then(() => print("📷 Camera Available"))
                            .catch(() => print("❌ Camera Blocked"));

                    }

                    // ================= 26. NOTIFICATION PERMISSION =================
                    else if (lower === "notifications") {

                        print("🔔 Notification Permission: " + Notification.permission);

                    }

                    // ================= 27. REQUEST NOTIFICATION =================
                    else if (lower === "enable notifications") {

                        Notification.requestPermission().then(p => {
                            print("Permission: " + p);
                        });

                    }

                    // ================= 28. SHOW NOTIFICATION =================
                    else if (lower === "test notification") {

                        new Notification("WBANK OS", {
                            body: "Notification system works ✔"
                        });

                    }

                    // ================= 29. CHECK LOCAL STORAGE =================
                    else if (lower === "storage support") {

                        print(typeof (Storage) !== "undefined"
                            ? "✔ LocalStorage Supported"
                            : "❌ Not Supported");

                    }

                    // ================= 30. CHECK SESSION STORAGE =================
                    else if (lower === "session support") {

                        print(typeof (sessionStorage) !== "undefined"
                            ? "✔ SessionStorage Supported"
                            : "❌ Not Supported");

                    }

                    // ================= 31. SHOW ALL URL INFO =================
                    else if (lower === "url info") {

                        print("Href: " + location.href);
                        print("Host: " + location.host);
                        print("Hostname: " + location.hostname);
                        print("Protocol: " + location.protocol);

                    }

                    // ================= 32. MEMORY TEST =================
                    else if (lower === "memory test") {

                        let arr = [];

                        for (let i = 0; i < 100000; i++) {
                            arr.push(i);
                        }

                        print("💾 Memory allocation test complete");

                    }

                    // ================= 33. DEVICE TYPE =================
                    else if (lower === "device type") {

                        let ua = navigator.userAgent;

                        if (/mobile/i.test(ua)) {
                            print("📱 Mobile Device");
                        } else {
                            print("🖥 Desktop Device");
                        }

                    }

                    // ================= 34. OS DETECTION =================
                    else if (lower === "os") {

                        let ua = navigator.userAgent;

                        if (ua.includes("Win")) print("🖥 Windows");
                        else if (ua.includes("Android")) print("📱 Android");
                        else if (ua.includes("iPhone")) print("🍎 iPhone");
                        else if (ua.includes("Mac")) print("💻 MacOS");
                        else print("Unknown OS");

                    }

                    // ================= 35. REFRESH PAGE =================
                    else if (lower === "refresh") {

                        location.reload();

                    }

                    // ================= 36. GO BACK =================
                    else if (lower === "back") {

                        history.back();

                    }

                    // ================= 37. GO FORWARD =================
                    else if (lower === "forward") {

                        history.forward();

                    }

                    // ================= 38. PRINT PAGE =================
                    else if (lower === "print page") {

                        window.print();

                    }

                    // ================= 39. PAGE SOURCE SIZE =================
                    else if (lower === "page size") {

                        print("📄 HTML Length: " + document.documentElement.innerHTML.length);

                    }

                    // ================= 40. SYSTEM DIAGNOSTIC =================
                    else if (lower === "diagnostic") {

                        print("============ WHITE OS DIAGNOSTIC ============");

                        print("Platform: " + navigator.platform);
                        print("Online: " + navigator.onLine);
                        print("Language: " + navigator.language);
                        print("CPU Cores: " + navigator.hardwareConcurrency);
                        print("RAM: " + (navigator.deviceMemory || "Unknown") + " GB");
                        print("Resolution: " + screen.width + "x" + screen.height);
                        print("Browser: " + navigator.userAgent);

                        print("✔ Diagnostic Complete");

                    }

                    // ================= 1. GENERATE UUID =================
                    else if (lower === "generate uuid") {
                        print("🆔 " + crypto.randomUUID());
                    }

                    // ================= 2. BASE64 ENCODE =================
                    else if (lower.startsWith("encode ")) {

                        let txt = cmd.replace("encode ", "");

                        print(btoa(txt));

                    }

                    // ================= 3. BASE64 DECODE =================
                    else if (lower.startsWith("decode ")) {

                        let txt = cmd.replace("decode ", "");

                        try {
                            print(atob(txt));
                        } catch {
                            print("❌ Invalid Base64");
                        }

                    }

                    // ================= 4. SHA-256 HASH =================
                    else if (lower.startsWith("cmd hash ")) {

                        let txt = cmd.replace("cmd hash ", "");

                        crypto.subtle.digest("SHA-256", new TextEncoder().encode(txt))
                            .then(buf => {

                                let hash = Array.from(new Uint8Array(buf))
                                    .map(b => b.toString(16).padStart(2, "0"))
                                    .join("");

                                print("🔐 " + hash);

                            });

                    }

                    // ================= 5. RANDOM FACT =================
                    else if (lower === "tech fact") {

                        let facts = [
                            "The first website is still online.",
                            "Linux powers most servers worldwide.",
                            "The first computer bug was a moth."
                        ];

                        print(facts[Math.floor(Math.random() * facts.length)]);

                    }

                    // ================= 6. ASCII CLOCK =================
                    else if (lower === "ascii clock") {

                        setInterval(() => {
                            print("🕒 " + new Date().toLocaleTimeString());
                        }, 1000);

                    }

                    // ================= 7. SYSTEM TEMP SIM =================
                    else if (lower === "temperature") {

                        let temp = Math.floor(Math.random() * 20) + 35;

                        print("🌡 CPU Temp: " + temp + "°C");

                    }

                    // ================= 8. GPU INFO =================
                    else if (lower === "gpu") {

                        let canvas = document.createElement("canvas");
                        let gl = canvas.getContext("webgl");

                        if (gl) {

                            let debug = gl.getExtension("WEBGL_debug_renderer_info");

                            print("🎮 GPU:");
                            print(gl.getParameter(debug.UNMASKED_RENDERER_WEBGL));

                        } else {

                            print("❌ WebGL not supported");

                        }

                    }

                    // ================= 13. DEVICE BATTERY HEALTH =================
